<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#0F0F0F">
  <meta name="robots" content="noindex">
  <title>Avaliações – APPDF</title>
  <link rel="icon" type="image/png" href="imagens/distintivo-policia-penal.png">
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <a class="pular" href="#conteudo">Ir para o conteúdo</a>

  <header class="topo-inst">
    <div class="faixa">
      <img class="emblema" src="imagens/brasao-df.png" alt="Brasão do Distrito Federal" width="101" height="120">
      <div class="inst-txt">
        <p>Governo do Distrito Federal</p>
        <p>Secretaria de Estado de Administração Penitenciária</p>
        <p class="inst-forte">Academia da Polícia Penal do Distrito Federal</p>
      </div>
      <img class="emblema" src="imagens/distintivo-policia-penal.png" alt="Distintivo da Polícia Penal do Distrito Federal" width="93" height="120">
    </div>
    <div class="hero" id="hero" aria-live="polite"></div>
  </header>

  <main id="conteudo" class="principal" tabindex="-1">
    <div id="app">
      <noscript>
        <div class="cartao"><p>Para responder à avaliação, ative o JavaScript do navegador.</p></div>
      </noscript>
    </div>
  </main>

  <nav id="nav" class="nav" aria-label="Navegação entre etapas" hidden>
    <div class="nav-in">
      <button type="button" id="btn-voltar" class="btn btn-secundario">Voltar</button>
      <button type="button" id="btn-avancar" class="btn btn-primario">Avançar</button>
    </div>
  </nav>

  <footer class="rodape">
    <p>Academia da Polícia Penal do Distrito Federal · SEAPE/DF</p>
  </footer>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
